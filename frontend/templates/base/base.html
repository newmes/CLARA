<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Clinical Trial Simulation{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    /* ── Global Nav Bar ── */
    .global-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: var(--bg-primary); border-bottom: 1px solid var(--border);
      height: 38px; display: flex; align-items: center; padding: 0 16px;
      font-size: 0.78em; gap: 4px;
    }
    .global-nav a {
      color: var(--text-muted); text-decoration: none; padding: 4px 10px;
      border-radius: 4px; transition: all 0.12s; white-space: nowrap;
    }
    .global-nav a:hover {
      color: var(--text-primary); background: var(--bg-elevated);
      text-decoration: none;
    }
    .global-nav a.nav-active {
      color: var(--accent-cyan); background: rgba(57,210,192,0.1);
    }
    .global-nav .nav-brand {
      font-weight: 700; color: var(--accent-cyan); font-size: 1.1em;
      margin-right: 8px; letter-spacing: -0.3px;
    }
    .global-nav .nav-sep {
      color: var(--border); margin: 0 2px; user-select: none;
    }
    .global-nav .nav-crumb {
      color: var(--text-secondary); font-family: 'JetBrains Mono', monospace;
      font-size: 0.92em;
    }
    body { padding-top: 38px; }
    /* game_play은 full-height 레이아웃이라 별도 처리 */
    body.no-nav-pad { padding-top: 0; }
    body.no-nav-pad .global-nav { display: none; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <!-- Global Navigation -->
  <nav class="global-nav">
    <a href="/" class="nav-brand">CTS</a>
    <span class="nav-sep">/</span>
    <a href="/">Runs</a>
    {% block nav_items %}{% endblock %}
  </nav>

  {% block content %}{% endblock %}
  {% block js_content %}{% endblock %}
</body>
</html>
