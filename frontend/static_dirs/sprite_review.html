<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Sprite Classification Review</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
  h1 { text-align: center; margin-bottom: 8px; font-size: 1.5rem; }
  .stats { text-align: center; margin-bottom: 20px; color: #aaa; font-size: 0.9rem; }
  .stats span { color: #f85149; font-weight: bold; }

  .controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .controls button {
    padding: 8px 16px; border: 1px solid #444; border-radius: 6px;
    background: #2a2a3e; color: #eee; cursor: pointer; font-size: 0.85rem;
  }
  .controls button:hover { background: #3a3a5e; }
  .controls button.active { background: #4a4a7e; border-color: #7a7aff; }

  .group { margin-bottom: 32px; }
  .group-title {
    font-size: 1.1rem; font-weight: 600; margin-bottom: 12px;
    padding: 8px 16px; background: #2a2a3e; border-radius: 6px; display: inline-block;
  }
  .group-title.f { border-left: 4px solid #f06292; }
  .group-title.m { border-left: 4px solid #42a5f5; }

  .grid { display: flex; flex-wrap: wrap; gap: 8px; }

  .card {
    width: 90px; text-align: center; padding: 8px 4px;
    border: 2px solid #333; border-radius: 8px; background: #22223a;
    cursor: pointer; transition: all 0.15s; position: relative;
  }
  .card:hover { border-color: #666; background: #2a2a4a; }
  .card.flagged { border-color: #f85149; background: #3a1a1a; }
  .card.flagged::after {
    content: '!'; position: absolute; top: 4px; right: 6px;
    color: #f85149; font-weight: bold; font-size: 1.1rem;
  }

  .card img {
    width: 64px; height: 64px; image-rendering: pixelated;
    object-fit: none; object-position: 0px 0px;
  }
  .card .num { font-size: 0.75rem; color: #888; margin-top: 4px; }
  .card .tag {
    font-size: 0.65rem; margin-top: 2px; padding: 1px 6px;
    border-radius: 3px; display: inline-block;
  }
  .tag.f-light   { background: #f06292; color: #fff; }
  .tag.f-medium  { background: #ab47bc; color: #fff; }
  .tag.f-dark    { background: #7b1fa2; color: #fff; }
  .tag.m-light   { background: #42a5f5; color: #fff; }
  .tag.m-medium  { background: #1976d2; color: #fff; }
  .tag.m-dark    { background: #0d47a1; color: #fff; }

  .summary {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #2a2a3e; border-top: 1px solid #444;
    padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
    z-index: 100;
  }
  .summary button {
    padding: 8px 20px; border: none; border-radius: 6px;
    background: #4a4a7e; color: #fff; cursor: pointer; font-size: 0.9rem;
  }
  .summary button:hover { background: #5a5a9e; }
  .summary .copy-btn { background: #2e7d32; }
  .summary .copy-btn:hover { background: #388e3c; }

  .reassign-panel {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #2a2a3e; border: 1px solid #555; border-radius: 12px;
    padding: 24px; z-index: 200; min-width: 300px;
  }
  .reassign-panel.show { display: block; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; }
  .overlay.show { display: block; }
  .reassign-panel h3 { margin-bottom: 16px; }
  .reassign-panel .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .reassign-panel .opt {
    padding: 10px; border: 1px solid #444; border-radius: 6px;
    cursor: pointer; text-align: center; font-size: 0.85rem;
  }
  .reassign-panel .opt:hover { border-color: #888; background: #3a3a5e; }

  body { padding-bottom: 70px; }
</style>
</head>
<body>

<h1>Sprite Classification Review</h1>
<p class="stats">Total: 97 sprites | Flagged: <span id="flagCount">0</span></p>

<div class="controls">
  <button class="active" onclick="filterAll(this)">All</button>
  <button onclick="filterGroup('F.light', this)">F / Light</button>
  <button onclick="filterGroup('F.medium', this)">F / Medium</button>
  <button onclick="filterGroup('F.dark', this)">F / Dark</button>
  <button onclick="filterGroup('M.light', this)">M / Light</button>
  <button onclick="filterGroup('M.medium', this)">M / Medium</button>
  <button onclick="filterGroup('M.dark', this)">M / Dark</button>
  <button onclick="filterGroup('flagged', this)" style="color:#f85149">Flagged Only</button>
</div>

<div id="container"></div>

<div class="summary">
  <div id="summaryText">Click sprites to flag misclassified ones. Click again to reassign.</div>
  <div style="display:flex;gap:8px;">
    <button onclick="clearAll()">Clear All</button>
    <button class="copy-btn" onclick="exportResult()">Export Changes</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="reassign-panel" id="reassignPanel">
  <h3 id="panelTitle">Reassign #00</h3>
  <div class="opts">
    <div class="opt" style="background:#3a1a2a" onclick="reassign('F','light')">F / Light</div>
    <div class="opt" style="background:#2a1a3a" onclick="reassign('F','medium')">F / Medium</div>
    <div class="opt" style="background:#1a1a3a" onclick="reassign('F','dark')">F / Dark</div>
    <div class="opt" style="background:#1a2a3a" onclick="reassign('M','light')">M / Light</div>
    <div class="opt" style="background:#1a2a4a" onclick="reassign('M','medium')">M / Medium</div>
    <div class="opt" style="background:#0a1a3a" onclick="reassign('M','dark')">M / Dark</div>
  </div>
  <div style="margin-top:12px;text-align:center">
    <button onclick="closePanel()" style="padding:6px 16px;border:1px solid #555;border-radius:4px;background:#333;color:#eee;cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
const SPRITE_MAP = {
  F: {
    light:  [1,5,9,15,25,29,49,62,66,69,70,73,74,77,78,79,81,82,85,86,87,89,92,93,95],
    medium: [2,12,14,53,61,63,65,67,71,75,90],
    dark:   [3,31,51,54,64,68,72,76,80,83,84,88,91,94,96,97],
  },
  M: {
    light:  [6,7,8,10,11,17,21,24,32,33,36,37,40,41,45,52,55,58],
    medium: [13,16,18,20,26,28,30,34,38,42,44,46,48,50,56,59],
    dark:   [4,19,22,23,27,35,39,43,47,57,60],
  },
};

// Build lookup: index → { gender, tone }
const lookup = {};
for (const [g, tones] of Object.entries(SPRITE_MAP)) {
  for (const [t, ids] of Object.entries(tones)) {
    for (const id of ids) lookup[id] = { gender: g, tone: t };
  }
}

// State: changes
const changes = {}; // id → { gender, tone } or null (unflagged)

function getClass(id) {
  return changes[id] || lookup[id] || { gender: 'M', tone: 'light' };
}

function pad(n) { return String(n).padStart(2, '0'); }

const groups = [
  { key: 'F.light',  label: 'Female / Light',  gender: 'F', tone: 'light' },
  { key: 'F.medium', label: 'Female / Medium', gender: 'F', tone: 'medium' },
  { key: 'F.dark',   label: 'Female / Dark',   gender: 'F', tone: 'dark' },
  { key: 'M.light',  label: 'Male / Light',    gender: 'M', tone: 'light' },
  { key: 'M.medium', label: 'Male / Medium',   gender: 'M', tone: 'medium' },
  { key: 'M.dark',   label: 'Male / Dark',     gender: 'M', tone: 'dark' },
];

let currentFilter = null;
let selectedId = null;

function render() {
  const container = document.getElementById('container');
  container.innerHTML = '';

  for (const grp of groups) {
    const ids = SPRITE_MAP[grp.gender][grp.tone];
    const filtered = currentFilter === 'flagged'
      ? ids.filter(id => changes[id])
      : currentFilter && currentFilter !== grp.key ? [] : ids;

    if (filtered.length === 0) continue;

    const div = document.createElement('div');
    div.className = 'group';
    div.innerHTML = `<div class="group-title ${grp.gender.toLowerCase()}">${grp.label} (${ids.length})</div>`;

    const grid = document.createElement('div');
    grid.className = 'grid';

    for (const id of filtered) {
      const cls = getClass(id);
      const isFlagged = !!changes[id];
      const tagClass = `${cls.gender.toLowerCase()}-${cls.tone}`;
      const tagLabel = `${cls.gender}/${cls.tone}`;

      const card = document.createElement('div');
      card.className = `card${isFlagged ? ' flagged' : ''}`;
      card.dataset.id = id;
      card.onclick = () => openPanel(id);
      card.innerHTML = `
        <img src="assets/characters/patient_${pad(id)}.png" alt="patient_${pad(id)}">
        <div class="num">#${pad(id)}</div>
        <div class="tag ${tagClass}">${isFlagged ? '→ ' : ''}${tagLabel}</div>
      `;
      grid.appendChild(card);
    }
    div.appendChild(grid);
    container.appendChild(div);
  }

  // Also show flagged from other groups if in flagged filter
  if (currentFilter === 'flagged') {
    // already handled above
  }

  updateStats();
}

function openPanel(id) {
  selectedId = id;
  const orig = lookup[id];
  document.getElementById('panelTitle').textContent =
    `#${pad(id)} — Current: ${orig.gender}/${orig.tone}`;
  document.getElementById('reassignPanel').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

function closePanel() {
  document.getElementById('reassignPanel').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  selectedId = null;
}

function reassign(gender, tone) {
  if (!selectedId) return;
  const orig = lookup[selectedId];
  if (orig.gender === gender && orig.tone === tone) {
    delete changes[selectedId]; // unflag if same as original
  } else {
    changes[selectedId] = { gender, tone };
  }
  closePanel();
  render();
}

function filterAll(btn) {
  currentFilter = null;
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function filterGroup(key, btn) {
  currentFilter = key;
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function clearAll() {
  Object.keys(changes).forEach(k => delete changes[k]);
  render();
}

function updateStats() {
  const count = Object.keys(changes).length;
  document.getElementById('flagCount').textContent = count;
  const text = count === 0
    ? 'Click sprites to flag misclassified ones.'
    : `${count} sprite(s) reassigned.`;
  document.getElementById('summaryText').textContent = text;
}

function exportResult() {
  const count = Object.keys(changes).length;
  if (count === 0) { alert('No changes to export.'); return; }

  // Build new SPRITE_MAP
  const newMap = { F: { light: [], medium: [], dark: [] }, M: { light: [], medium: [], dark: [] } };

  // All known IDs
  const allIds = Object.keys(lookup).map(Number).sort((a, b) => a - b);
  for (const id of allIds) {
    const cls = getClass(id);
    newMap[cls.gender][cls.tone].push(id);
  }

  // Sort arrays
  for (const g of ['F', 'M'])
    for (const t of ['light', 'medium', 'dark'])
      newMap[g][t].sort((a, b) => a - b);

  const lines = [];
  lines.push('const SPRITE_MAP = {');
  for (const g of ['F', 'M']) {
    lines.push(`  ${g}: {`);
    for (const t of ['light', 'medium', 'dark']) {
      const arr = newMap[g][t].join(',');
      lines.push(`    ${t.padEnd(6)}: [${arr}],`);
    }
    lines.push('  },');
  }
  lines.push('};');

  const changeList = Object.entries(changes).map(([id, c]) => {
    const orig = lookup[id];
    return `#${pad(id)}: ${orig.gender}/${orig.tone} → ${c.gender}/${c.tone}`;
  }).join('\n');

  const output = `// === Changes ===\n${changeList}\n\n// === Updated SPRITE_MAP ===\n${lines.join('\n')}`;

  // Always show textarea (clipboard API fails on HTTP)
  const existing = document.getElementById('exportOverlay');
  if (existing) existing.remove();

  const wrap = document.createElement('div');
  wrap.id = 'exportOverlay';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;display:flex;align-items:center;justify-content:center;';

  const box = document.createElement('div');
  box.style.cssText = 'background:#1e1e2e;border:1px solid #555;border-radius:12px;padding:20px;width:80%;max-width:700px;max-height:80vh;display:flex;flex-direction:column;gap:12px;';

  const title = document.createElement('div');
  title.textContent = `${count} change(s) — Copy the code below`;
  title.style.cssText = 'font-size:1rem;font-weight:600;color:#eee;';

  const ta = document.createElement('textarea');
  ta.value = output;
  ta.readOnly = true;
  ta.style.cssText = 'flex:1;min-height:300px;font-family:monospace;font-size:13px;background:#12121e;color:#eee;padding:16px;border:1px solid #444;border-radius:8px;resize:none;line-height:1.5;';

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;';

  const copyBtn = document.createElement('button');
  copyBtn.textContent = 'Select All';
  copyBtn.style.cssText = 'padding:8px 16px;background:#2e7d32;color:#fff;border:none;border-radius:6px;cursor:pointer;';
  copyBtn.onclick = () => { ta.select(); };

  const closeBtn = document.createElement('button');
  closeBtn.textContent = 'Close';
  closeBtn.style.cssText = 'padding:8px 16px;background:#555;color:#fff;border:none;border-radius:6px;cursor:pointer;';
  closeBtn.onclick = () => wrap.remove();

  btnRow.appendChild(copyBtn);
  btnRow.appendChild(closeBtn);
  box.appendChild(title);
  box.appendChild(ta);
  box.appendChild(btnRow);
  wrap.appendChild(box);
  wrap.onclick = (e) => { if (e.target === wrap) wrap.remove(); };
  document.body.appendChild(wrap);
  ta.select();
}

// Initial render
render();
</script>
</body>
</html>
