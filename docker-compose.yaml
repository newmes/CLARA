services:
  django:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ${VITAL_CONTAINER:-clara_dev}
    restart: unless-stopped
    ports:
      - "${VITAL_PORT:-19001}:9001"
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
      - ./src:/app/src
    environment:
      CTE_VLLM_BASE_URL: "http://clara-medgemma27b:8000/v1"
      CTE_VLLM_MODEL_ID: "google/medgemma-27b-it"
      CTE_VLLM_API_KEY: "EMPTY"
      MEDGEMMA4B_VLLM_BASE_URL: "http://clara-medgemma4b-ft:8000/v1"
      MEDGEMMA4B_MODEL_ID: "medgemma-4b-finetuned"
      MEDGEMMA4B_BASE_VLLM_BASE_URL: "http://clara-medgemma4b:8000/v1"
      MEDGEMMA4B_BASE_MODEL_ID: "google/medgemma-4b-it"
      PYTHONPATH: "/app"
    networks:
      - vital-net

  medgemma27b:
    image: vllm/vllm-openai:latest
    container_name: clara-medgemma27b
    restart: unless-stopped
    ports:
      - "38000:8000"
    profiles:
      - medgemma27b
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - /data2/huggingface/hub:/root/.cache/huggingface/hub:ro
    shm_size: "4g"
    command:
      - "--model"
      - "google/medgemma-27b-it"
      - "--served-model-name"
      - "google/medgemma-27b-it"
      - "--quantization"
      - "bitsandbytes"
      - "--load-format"
      - "bitsandbytes"
      - "--max-model-len"
      - "4096"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--trust-remote-code"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_MEDGEMMA27B:-3}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - vital-net

  medgemma4b-ft:
    image: vllm/vllm-openai:latest
    container_name: clara-medgemma4b-ft
    restart: unless-stopped
    ports:
      - "38001:8000"
    profiles:
      - medgemma4b-ft
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - /data2/workspace/AlphaRaven/old/MedGemma/multimodality_generation/output/v3_merged_bf16_ctcae:/model:ro
    shm_size: "4g"
    command:
      - "--model"
      - "/model"
      - "--served-model-name"
      - "medgemma-4b-finetuned"
      - "--dtype"
      - "bfloat16"
      - "--max-model-len"
      - "4096"
      - "--limit-mm-per-prompt"
      - '{"image": 2}'
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.4"
      - "--trust-remote-code"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_MEDGEMMA4B_FT:-3}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - vital-net

  medgemma4b:
    image: vllm/vllm-openai:latest
    container_name: clara-medgemma4b
    restart: unless-stopped
    ports:
      - "38002:8000"
    profiles:
      - medgemma4b
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - /data2/huggingface/hub:/root/.cache/huggingface/hub:ro
    shm_size: "4g"
    command:
      - "--model"
      - "google/medgemma-4b-it"
      - "--served-model-name"
      - "google/medgemma-4b-it"
      - "--dtype"
      - "bfloat16"
      - "--max-model-len"
      - "4096"
      - "--limit-mm-per-prompt"
      - '{"image": 2}'
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.4"
      - "--trust-remote-code"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_MEDGEMMA4B:-3}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - vital-net

networks:
  vital-net:
    external: true
