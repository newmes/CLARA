services:
  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: ${VITAL_CONTAINER:-clara_dev}
    restart: unless-stopped
    ports:
      - "${VITAL_PORT:-19001}:9001"
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
      - ./src:/app/src
      - ./validation:/app/validation
    environment:
      CTE_VLLM_BASE_URL: "http://clara-medgemma4b-antihallu:8000/v1"
      CTE_VLLM_MODEL_ID: "medgemma-4b-antihallu"
      CTE_VLLM_API_KEY: "EMPTY"
      MEDGEMMA4B_VLLM_BASE_URL: "http://clara-medgemma4b-antihallu:8000/v1"
      MEDGEMMA4B_MODEL_ID: "medgemma-4b-ctcae"
      MEDGEMMA4B_BASE_VLLM_BASE_URL: "http://clara-medgemma4b-base:8000/v1"
      MEDGEMMA4B_BASE_MODEL_ID: "medgemma-1.5-4b-it"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      CARE_AI_API_URL: "http://clara-care-ai:8300"
      PYTHONPATH: "/app"
    networks:
      - vital-net

  medgemma4b-base:
    image: vllm/vllm-openai:latest
    container_name: clara-medgemma4b-base
    restart: unless-stopped
    ports:
      - "38004:8000"
    profiles:
      - medgemma4b-base
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - /data2/huggingface/hub/models--google--medgemma-1.5-4b-it:/model_repo:ro
    shm_size: "4g"
    command:
      - "--model"
      - "/model_repo/snapshots/e9792da5fb8ee651083d345ec4bce07c3c9f1641"
      - "--served-model-name"
      - "medgemma-1.5-4b-it"
      - "--dtype"
      - "bfloat16"
      - "--max-model-len"
      - "4096"
      - "--limit-mm-per-prompt"
      - '{"image": 2}'
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.4"
      - "--trust-remote-code"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - vital-net

  medgemma4b-antihallu-ft:
    image: vllm/vllm-openai:latest
    container_name: clara-medgemma4b-antihallu
    restart: unless-stopped
    ports:
      - "38002:8000"
    profiles:
      - medgemma4b-antihallu
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./models/medgemma-4b-ft-antihallu:/model
      - ./models/lora-ctcae:/lora-ctcae:ro
      - /data2/huggingface/hub/models--google--medgemma-1.5-4b-it/blobs/1299c11d7cf632ef3b4e11937501358ada021bbdf7c47638d13c0ee982f2e79c:/model/tokenizer.model:ro
      - /data2/huggingface/hub/models--google--medgemma-1.5-4b-it/blobs/7d4046bf0505a327dd5a0abbb427ecd4fc82f99c2ceaa170bc61ecde12809b0c:/model/tokenizer.json:ro
      - /data2/huggingface/hub/models--google--medgemma-4b-it/blobs/72c9f6bc082907666631052305438b5e7db2a8e2:/model/tokenizer_config.json:ro
      - /data2/huggingface/hub/models--google--medgemma-1.5-4b-it/blobs/1a6193244714d3d78be48666cb02cdbfac62ad86:/model/special_tokens_map.json:ro
      - /data2/huggingface/hub/models--google--medgemma-1.5-4b-it/blobs/e17bde03d42feda32d1abfca6d3b598b9a020df7:/model/added_tokens.json:ro
      - /data2/huggingface/hub/models--google--medgemma-1.5-4b-it/blobs/cbd4f0cd77e39566f11921f9995bb3a4d008a83e:/model/preprocessor_config.json:ro
    shm_size: "4g"
    command:
      - "--model"
      - "/model"
      - "--served-model-name"
      - "medgemma-4b-antihallu"
      - "--dtype"
      - "bfloat16"
      - "--max-model-len"
      - "4096"
      - "--limit-mm-per-prompt"
      - '{"image": 2}'
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.45"
      - "--trust-remote-code"
      - "--enable-lora"
      - "--lora-modules"
      - "medgemma-4b-ctcae=/lora-ctcae"
      - "--max-lora-rank"
      - "8"
      - "--max-loras"
      - "1"
      - "--max-cpu-loras"
      - "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_MEDGEMMA4B:-3}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - vital-net

  antihallu-server:
    build:
      context: .
      dockerfile: Dockerfile.antihallu
    container_name: clara-antihallu
    restart: unless-stopped
    ports:
      - "38003:8000"
    profiles:
      - antihallu
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      GRPO_MODEL_PATH: "/model_dapo"
      DAPO_SYSTEM_PROMPT: "You are a helpful medical AI assistant. If you are not sure about something, say so. Do not make up information. Always recommend consulting a healthcare professional."
    volumes:
      - /data2/huggingface:/hf_cache:ro
      - ./models/medgemma-4b-ft-antihallu:/model_dapo:ro
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ANTIHALLU:-2}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - vital-net

  care-ai-server:
    build:
      context: .
      dockerfile: Dockerfile.care-ai
    container_name: clara-care-ai
    restart: unless-stopped
    ports:
      - "38005:8300"
    profiles:
      - care-ai
    environment:
      CARE_AI_GPU: "0"
      CARE_AI_PORT: "8300"
      MEDGEMMA_MODEL: "/model_repo/snapshots/290cda5eeccbee130f987c4ad74a59ae6f196408"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      HF_HOME: "/hf_cache"
      HF_TOKEN: "${HF_TOKEN}"
    volumes:
      - /data2/huggingface:/hf_cache
      - /data2/huggingface/hub/models--google--medgemma-4b-it:/model_repo:ro
      - /data2/workspace/ClinicalTrialEngine/data:/data:ro
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_CARE_AI:-3}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8300/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - vital-net

networks:
  vital-net:
    external: true
